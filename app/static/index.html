<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{APP_NAME}}</title>
  <meta name="description" content="Résultats en direct des tournois HappyScore, et notifications pour les joueurs, joueuses et matchs que vous suivez.">
  <meta name="theme-color" content="#1f4d3a">
  <link rel="manifest" id="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v={{V}}">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v={{V}}">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v={{V}}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <link rel="stylesheet" href="/static/style.css?v={{V}}">
  <script src="/static/core.js?v={{V}}" defer></script>
  <script src="/static/app.js?v={{V}}" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap topbar">
      <a id="nav-back" class="nav-back" href="#/" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Retour</span></a>
      <a class="brand" href="#/" aria-label="Accueil"><img class="ball" src="/static/icons/ball-96.png?v={{V}}" alt="" width="26" height="26"><span class="brand-name">{{APP_NAME}}</span></a>
    </div>
  </header>

  <main class="wrap">
    <section id="notif" class="card notif" aria-live="polite" hidden></section>
    <div id="view" aria-live="polite"><p class="muted loading">Chargement…</p></div>

    <section id="qr" class="card qr" hidden>
      <img id="qr-img" alt="QR code vers cette page" width="168" height="168">
      <div>
        <h2>Sur votre téléphone</h2>
        <p>Scannez ce code avec l'appareil photo : vos suivis seront repris, il restera à activer les notifications.</p>
      </div>
    </section>
  </main>

  <footer class="wrap muted small">
    Données <a href="https://tennis.happyscore.net/tournoi" rel="noopener">HappyScore</a> ·
    <a href="https://github.com/Mincka/tennis-suivi" rel="noopener">code source</a> ·
    <a href="/confidentialite">confidentialité</a>
    <br><button id="footer-test" class="link-btn" hidden>Tester les notifications</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
